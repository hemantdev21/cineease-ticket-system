<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - CineEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">
  <div class="login-box p-4 rounded-4 bg-secondary-subtle shadow-lg text-center">
    <h1 class="mb-4 text-warning">Create Account</h1>
    <form onsubmit="signup(event)">
      <input type="text" id="signupUsername" class="form-control mb-3" placeholder="Username" required />
      <input type="password" class="form-control mb-3" placeholder="Password" required />
      <button type="submit" class="btn btn-warning w-100">Sign Up</button>
    </form>
    <p class="mt-3 text-light">Already have an account? <a href="index.html" class="text-warning">Login</a></p>
  </div>
  <script>
    function signup(e) {
      e.preventDefault();
      const user = document.getElementById("signupUsername").value;
      localStorage.setItem("cineease_user", user);
      location.href = "dashboard.html";
    }
  </script>
</body>
</html>
