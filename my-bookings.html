<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Bookings - CineEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-dark text-white">
  <nav class="navbar navbar-dark bg-black sticky-top shadow">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">🎬 CineEase</a>
    </div>
  </nav>

  <div class="container py-5">
    <h3 class="text-warning">📂 Your Bookings</h3>
    <div id="bookingsList" class="mt-4"></div>
  </div>

  <script>
    const container = document.getElementById('bookingsList');
    const bookings = JSON.parse(localStorage.getItem('cineease_bookings') || '[]');
    const user = localStorage.getItem('cineease_user');
  
    const userBookings = bookings.filter(b => b.user === user);
    if (userBookings.length === 0) {
      container.innerHTML = '<p class="text-light">No bookings yet.</p>';
    } else {
      userBookings.forEach((b, index) => {
        const div = document.createElement('div');
        div.className = 'card bg-secondary text-white mb-4 p-3';
  
        const ticketId = `ticket-${index}`;
        div.innerHTML = `
          <div id="${ticketId}" style="color: black; font-family: Arial, sans-serif;">
            <h5>🎬 ${b.movie}</h5>
            <p>🕒 ${b.time}</p>
            <p>💺 Seats: ${b.seats.join(', ')}</p>
            <p>📅 ${b.date}</p>
            <img src="${b.qr}" alt="QR Code" width="150" class="my-2"/>
          </div>
          <button class="btn btn-warning mt-2" onclick="downloadTicket('${ticketId}', '${b.movie}')">⬇️ Download Ticket PDF</button>
        `;
        container.appendChild(div);
      });
    }
  
    function downloadTicket(ticketId, movieName) {
      const element = document.getElementById(ticketId);
      const opt = {
        margin:       0.5,
        filename:     `${movieName.replace(/\s+/g, '_')}_ticket.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }
  </script>
  
</body>
</html>
