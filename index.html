<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineEase - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100 text-white">
  <div class="login-box p-4 rounded-4 bg-secondary-subtle shadow-lg text-center">
    <h1 class="mb-4 text-warning">CineEase 🎬</h1>
    <form id="loginForm">
      <input type="text" id="loginUsername" class="form-control mb-3" placeholder="Username" required />
      <input type="password" class="form-control mb-3" placeholder="Password" required />
      <button type="submit" class="btn btn-warning w-100">Login</button>
    </form>
    <p class="mt-3 text-light">Don't have an account? <a href="signup.html" class="text-warning">Sign up</a></p>
  </div>
  <script>
    document.getElementById("loginForm").onsubmit = e => {
      e.preventDefault();
      const user = document.getElementById("loginUsername").value;
      localStorage.setItem("cineease_user", user);
      location.href = "dashboard.html";
    };
  </script>
</body>
</html>
