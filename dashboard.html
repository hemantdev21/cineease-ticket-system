<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineEase - Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="dashboard-page">
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3 py-2 justify-content-between">
    <div class="d-flex align-items-center gap-3">
      <img src="images/avatar.png" alt="Avatar" class="rounded-circle" width="40" height="40" />
      <span class="navbar-text text-light fw-semibold fs-5" id="username">Hi, User!</span>
    </div>
    <div>
      <a href="my-bookings.html" class="btn btn-warning me-2">My Bookings</a>
      <button class="btn btn-outline-light" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- Title -->
  <header class="text-center py-4">
    <h1 class="text-warning fw-bold">Now Showing 🍿</h1>
  </header>

  <!-- Movie Grid -->
  <main class="container">
    <div id="movieList" class="row gy-4"></div>
  </main>

  <script src="movies.js"></script>
  <script src="common.js"></script>
</body>
</html>
